services:
  # ─── Bug Arena Node.js Backend ───
  - type: web
    name: bug-arena-backend
    env: node
    plan: free
    # The server code is inside the 'server' directory
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false # You must set this in the Render dashboard (MongoDB Atlas URI)
      - key: ALLOWED_ORIGINS
        value: https://cosmos.42web.io,http://localhost:5173
